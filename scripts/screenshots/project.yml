name: Shots
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ShotsHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mmtac.shots.host
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGNING_ALLOWED: NO
  ShotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShotsHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mmtac.shots.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: ShotsHost
      CODE_SIGNING_ALLOWED: NO
